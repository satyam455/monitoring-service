name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smartx
          POSTGRES_PASSWORD: smartx
          POSTGRES_DB: monitoring
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U smartx -d monitoring"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
          cache: true
      - run: go mod tidy
      - run: go test -race ./...
      - run: go vet ./...

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t smartx-monitor:${{ github.sha }} .
